name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Rust tests (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, windows-latest]
        toolchain: [stable]
        include:
          - os: ubuntu-latest
            toolchain: nightly
    steps:
      - name: Checkout sources
        uses: ./.github/actions/checkout-submodules
        with:
          fetch-depth: 1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Run tests
        run: cargo test --all-features

  build-wheels:
    name: Build wheels (${{ matrix.platform }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
        platform: [linux, macos, windows]
        include:
          - platform: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: macos
            os: macos-13
            target: x86_64-apple-darwin
          - platform: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
      steps:
        - name: Checkout sources
          uses: ./.github/actions/checkout-submodules
          with:
            fetch-depth: 1
        - name: Set up Python ${{ matrix.python-version }}
          uses: actions/setup-python@v5
          with:
            python-version: ${{ matrix.python-version }}
        - name: Build wheel
          uses: PyO3/maturin-action@v1
          with:
            target: ${{ matrix.target }}
            args: --release --out dist
            manylinux: ${{ matrix.platform == 'linux' && 'manylinux_2_28' || 'off' }}
            container: ${{ matrix.platform == 'linux' && 'ghcr.io/pyo3/maturin' || '' }}
        - name: Upload wheel artifacts
          uses: actions/upload-artifact@v4
          with:
            name: wheels-${{ matrix.platform }}-py${{ matrix.python-version }}
            path: dist
